<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>에버론 : 아르카닉스 마법학교</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_8Gmarket@1.0/GmarketSansMedium.woff2" rel="stylesheet">
    <style>
      @font-face {
        font-family: 'RIDIBatang';
        src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.0/RIDIBatang.woff') format('woff');
        font-weight: normal;
        font-style: normal;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'RIDIBatang', sans-serif;
        font-size: 10px;
        height: 100vh;
        display: flex;
        overflow: hidden;
      }
      nav {
        width: 300px;
        background: #f5f5f5;
        padding: 20px;
        overflow-y: auto;
        border-right: 1px solid #ddd;
        flex-shrink: 0;
      }
      nav h2 { font-size: 18px; margin-bottom: 20px; }
      nav a {
        font-size: 12px;
        display: block;
        margin-bottom: 3px;
        color: black;
        text-decoration: none;
        padding: 2px 6px;
        border-radius: 4px;
      }
      nav a:hover {
        background-color: #b2b2b2;
        text-decoration: underline;
      }
      nav summary { font-size: 13px; margin: 10px 0 5px; cursor: pointer; }
      nav details[open] summary { font-weight: bold; }
      .container { flex-grow: 1; display: flex; overflow: hidden; }
      .map-area {
        width: 60%; min-width: 200px; max-width: 90%;
        background: white;
        display: flex; justify-content: center; align-items: center;
        overflow: auto; padding: 20px; transition: width 0.2s;
      }
      #mapImage { max-width: 1200px; width: 100%; height: auto; object-fit: contain; }
      .resizer { width: 5px; background: #ccc; cursor: col-resize; }
      .pdf-area {
        flex-grow: 1; background: #fff; overflow-y: auto;
        padding: 10px; display: flex; flex-direction: column; align-items: center;
        border-left: 1px solid #ddd; scroll-behavior: smooth; transition: width 0.2s;
      }
      canvas { display: block; width: auto; max-width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <nav>
      <h2>에버론 : 아르카닉스 마법학교</h2>
      <details>
        <summary><strong>프롤로그</strong></summary>
        <a href="?page=prologue_elka.pdf&map=prologue_elka">[EP0] 엘카</a>
        <a href="?page=prologue_miya.pdf&map=prologue_miya">[EP0] 미야 일'라우렐</a>
        <a href="?page=prologue_vesper.pdf&map=prologue_vesper">[EP0] 베스퍼</a>
        <a href="?page=prologue_arian.pdf&map=prologue_arian">[EP0] 아리안 체니아</a>
      </details>
      <details open>
        <summary><strong>아르카닉스 마법학교 : 최후의 전쟁의 그림자</strong></summary>
        <a href="?page=ep1.pdf&map=ep1">1화. 아주 긴 시간표</a>
        <a href="?page=ep2.pdf&map=ep2">2화. 첫번째 수업</a>
        <a href="?page=ep3.pdf&map=ep3">3화. 순수한 피</a>
        <a href="?page=ep4.pdf&map=ep4">4화. 두번째 날 수업</a>
        <a href="?page=ep5.pdf&map=ep5">5화. 첫번째 의뢰</a>
        <a href="?page=ep6.pdf&map=ep6">6화. 실습훈련?</a>
        <a href="?page=ep7.pdf&map=ep7">7화. 도서관의 요정 파페라!</a>
        <a href="?page=ep8.pdf&map=ep8">8화. 파이어볼은 아프다...</a>
        <a href="?page=ep9.pdf&map=ep9">9화. 신비한 수업</a>
        <a href="?page=ep10.pdf&map=ep10">10화. 마법의 마을</a>
        <a href="?page=ep11.pdf&map=ep11">11화. 아르카닉스</a>
        <a href="?page=ep12.pdf&map=ep12">12화. 나른한 주말</a>
        <a href="?page=ep13.pdf&map=ep13">13화. 비밀의 숲</a>
        <a href="?page=ep14.pdf&map=ep14">14화. 첫번째 성취도 평가</a>
        <a href="?page=ep15.pdf&map=ep15">15화. 부두술에 너무 심취하지 말게</a>
      </details>
    </nav>
    <div class="container">
      <div class="map-area">
        <img id="mapImage" src="./maps/ep1/map1.png" alt="맵 이미지">
      </div>
      <div class="resizer" id="resizer"></div>
      <div id="content" class="pdf-area"></div>
    </div>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const page = urlParams.get('page') || 'ep1.pdf';
      const mapFolder = urlParams.get('map') || 'ep1';
      const pdfUrl = `./pdfs/${page}`;
      const pdfjsLib = window['pdfjs-dist/build/pdf'];
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
      const content = document.getElementById('content');
      const mapImage = document.getElementById('mapImage');
      function getMapImage(pageNumber) {
        const fixed = ["ep9","ep10","ep11","ep12","ep13"];
        if (fixed.includes(mapFolder)) return `./maps/${mapFolder}/map1.png`;
        if (mapFolder === 'ep14') {
          if (pageNumber <=3) return './maps/ep14/map1.png';
          if (pageNumber <=11) return './maps/ep14/map2.png';
          if (pageNumber <=31) return './maps/ep14/map3.png';
          if (pageNumber <=45) return './maps/ep14/map4.png';
          if (pageNumber <=55) return './maps/ep14/map5.png';
          if (pageNumber <=58) return './maps/ep14/map6.png';
          if (pageNumber <=72) return './maps/ep14/map7.png';
          if (pageNumber <=74) return './maps/ep14/map8.png';
          return './maps/ep14/map9.png';
        }
        if (mapFolder === 'ep15') {
          if (pageNumber <=1) return './maps/ep15/map1.png';
          if (pageNumber <=11) return './maps/ep15/map2.png';
          if (pageNumber <=21) return './maps/ep15/map3.png';
          if (pageNumber <=32) return './maps/ep15/map4.png';
          if (pageNumber <=43) return './maps/ep15/map5.png';
          if (pageNumber <=65) return './maps/ep15/map6.png';
          if (pageNumber <=75) return './maps/ep15/map7.png';
          if (pageNumber <=89) return './maps/ep15/map8.png';
          return './maps/ep15/map9.png';
        }
        if (mapFolder === 'ep5') {
          if (pageNumber===1) return './maps/ep5/map1.png';
          if (pageNumber<=5) return './maps/ep5/map2.png';
          if (pageNumber===6) return './maps/ep5/map3.png';
          if (pageNumber===7) return './maps/ep5/map4.png';
          if (pageNumber<=29) return './maps/ep5/map5.png';
          if (pageNumber<=31) return './maps/ep5/map6.png';
          if (pageNumber<=46) return './maps/ep5/map7.png';
          if (pageNumber<=52) return './maps/ep5/map8.png';
          if (pageNumber<=59) return './maps/ep5/map9.png';
          if (pageNumber<=63) return './maps/ep5/map10.png';
          if (pageNumber<=96) return './maps/ep5/map11.png';
          if (pageNumber<=101) return './maps/ep5/map12.png';
          if (pageNumber<=107) return './maps/ep5/map13.png';
          if (pageNumber<=110) return './maps/ep5/map14.png';
          if (pageNumber<=118) return './maps/ep5/map15.png';
          if (pageNumber<=126) return './maps/ep5/map16.png';
          if (pageNumber<=132) return './maps/ep5/map17.png';
          if (pageNumber<=140) return './maps/ep5/map18.png';
          if (pageNumber<=167) return './maps/ep5/map19.png';
          if (pageNumber<=173) return './maps/ep5/map20.png';
          if (pageNumber<=194) return './maps/ep5/map21.png';
          if (pageNumber<=200) return './maps/ep5/map22.png';
          if (pageNumber<=205) return './maps/ep5/map23.png';
          if (pageNumber<=208) return './maps/ep5/map24.png';
          if (pageNumber<=241) return './maps/ep5/map25.png';
          if (pageNumber<=244) return './maps/ep5/map26.png';
          if (pageNumber<=246) return './maps/ep5/map27.png';
          if (pageNumber<=250) return './maps/ep5/map28.png';
          if (pageNumber<=257) return './maps/ep5/map29.png';
          return './maps/ep5/map3.png';
        }
        return `./maps/${mapFolder}/map1.png`;
      }
      let pdfDoc, observer;
      pdfjsLib.getDocument(pdfUrl).promise.then(pdf => {
        pdfDoc = pdf;
        for (let i=1;i<=pdf.numPages;i++) {
          const c=document.createElement('canvas');
          c.dataset.pageNumber=i; c.className='pdf-page';
          content.appendChild(c);
        }
        observer=new IntersectionObserver(es=>{
          es.forEach(e=>{
            if(e.isIntersecting) {
              const c=e.target,pn=+c.dataset.pageNumber;
              if(!c.dataset.rendered) {
                pdfDoc.getPage(pn).then(page=>{
                  const v=page.getViewport({scale:1.5});
                  c.width=v.width; c.height=v.height;
                  page.render({canvasContext:c.getContext('2d'),viewport:v});
                  c.dataset.rendered=true;
                });
              }
            }
          });
        },{root:content,threshold:0.1});
        document.querySelectorAll('.pdf-page').forEach(c=>observer.observe(c));
      });
      content.addEventListener('scroll',()=>{
        let closest,md=Infinity,my=innerHeight/2;
        document.querySelectorAll('.pdf-page').forEach(c=>{
          const r=c.getBoundingClientRect(),d=Math.abs(my-(r.top+r.height/2));
          if(d<md){md=d;closest=c;}
        });
        if(closest) {
          const pn=+closest.dataset.pageNumber,src=getMapImage(pn);
          if(!mapImage.src.endsWith(src))mapImage.src=src;
        }
      });
    </script>
  </body>
</html>
